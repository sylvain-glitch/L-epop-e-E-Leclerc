<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Joueur - L’Épopée E.Leclerc</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap">
<div class="brand"><h1>Joueur</h1><span class="pill">L’Épopée E.Leclerc</span></div>
<section id="join" class="card"><h2>Rejoindre une partie</h2><label>Code de partie<input id="code" maxlength="5" autocapitalize="characters" placeholder="ABCDE"></label><br><label>Nom / équipe<input id="name" maxlength="24" placeholder="Ex. Équipe Orange"></label><div style="height:12px"></div><button id="go" class="btn primary">Rejoindre</button></section>
<section id="game" class="hidden"><div class="card statusbar"><div><strong id="me"></strong><div class="muted">Partie <span id="roomCode"></span></div></div><div class="score"><span id="score">0</span> pts</div></div>
<div id="waiting" class="card bigcenter"><h2>En attente de l’animateur…</h2><p>Votre smartphone est bien connecté à la partie.</p></div>
<div id="questionCard" class="card hidden"><div class="statusbar"><span id="qnum" class="pill"></span><span id="theme" class="pill"></span></div><p id="question" class="question"></p><p id="context" class="context"></p><div id="answers" class="answers"></div><div id="notice" class="feedback hidden"></div></div>
<div id="finish" class="card hidden"><h2>🏁 Partie terminée</h2><div id="ranking"></div></div></section>
</main><script>
let code='',playerId='',es=null,state=null;const $=s=>document.querySelector(s);
const prefillCode=new URLSearchParams(location.search).get('code'); if(prefillCode){$('#code').value=prefillCode.toUpperCase().slice(0,5); setTimeout(()=>$('#name').focus(),50);}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur');return j}
$('#go').onclick=async()=>{try{code=$('#code').value.trim().toUpperCase();const j=await post('/api/join',{code,name:$('#name').value});playerId=j.playerId;code=j.code;$('#join').classList.add('hidden');$('#game').classList.remove('hidden');$('#roomCode').textContent=code;connect()}catch(e){alert(e.message)}};
function connect(){if(es)es.close();es=new EventSource('/events?code='+encodeURIComponent(code)+'&playerId='+encodeURIComponent(playerId));es.onmessage=e=>{state=JSON.parse(e.data);render()};es.onerror=()=>{}}
function render(){if(!state)return;const me=state.me||{};$('#me').textContent=me.name||'Joueur';$('#score').textContent=me.score||0;$('#waiting').classList.toggle('hidden',state.phase!=='lobby');$('#questionCard').classList.toggle('hidden',!['question','revealed'].includes(state.phase));$('#finish').classList.toggle('hidden',state.phase!=='finished');
if(state.question){$('#qnum').textContent='Question '+state.questionNumber+'/'+state.target;$('#theme').textContent=state.question.theme;$('#question').textContent=state.question.q;$('#context').textContent=state.question.ctx||'';$('#answers').innerHTML=state.question.a.map((a,i)=>{let cls='answer';if(state.myAnswer===i)cls+=' selected';if(state.phase==='revealed'&&i===state.question.c)cls+=' correct';if(state.phase==='revealed'&&state.myAnswer===i&&i!==state.question.c)cls+=' wrong';return `<button class="${cls}" data-i="${i}" ${state.phase!=='question'||state.myAnswer!==null?'disabled':''}><b>${'ABCD'[i]}.</b> ${esc(a)}</button>`}).join('');document.querySelectorAll('#answers .answer').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
const n=$('#notice');if(state.phase==='question'&&state.myAnswer!==null){n.classList.remove('hidden');n.textContent='Réponse enregistrée. Attendez la correction de l’animateur.'}else if(state.phase==='revealed'){n.classList.remove('hidden');const good=state.myAnswer===state.question.c;n.innerHTML=(good?'✅ <b>Bonne réponse.</b>':'❌ <b>Réponse incorrecte.</b>')+' '+esc(state.question.exp||'')+(state.winnerId===playerId?'<br><br>⚡ Vous êtes le plus rapide : +'+state.question.pts+' point(s).':'')}else n.classList.add('hidden')}
if(state.phase==='finished'){const rank=[...state.players].sort((a,b)=>b.score-a.score||b.correct-a.correct);$('#ranking').innerHTML=rank.map((p,i)=>`<div class="rank ${p.id===playerId?'winner':''}"><strong>${i+1}. ${esc(p.name)}</strong><span>${p.score} pts • ${p.correct}/${p.answered}</span></div>`).join('')}}
async function answer(i){try{await post('/api/answer',{code,playerId,answer:i})}catch(e){alert(e.message)}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
